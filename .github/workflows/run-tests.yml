name: run-tests

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 8.4 is the floor because the rule corpora this tool exists to transpile require it:
          # symplify/phpstan-rules 14.12 and tomasvotruba/type-coverage 2.3 both declare `php: ^8.4`,
          # and six test files read them, so an 8.3 job could neither install nor test anything.
          - { php: '8.4', stability: prefer-lowest }
          - { php: '8.4', stability: prefer-stable }
          - { php: '8.5', stability: prefer-stable }

    name: P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
